<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ========== FEED VIEW ========== -->
  <div class="app" id="app">
    <header class="header">
      <div class="header-logo">stories</div>
      <div class="header-icons">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.44 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6 6l1.1-1.1a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </div>
    </header>

    <!-- Stories strip -->
    <section class="stories-strip-wrapper">
      <div class="stories-strip" id="storiesStrip">
        <!-- Injected by JS -->
        <div class="stories-loading">
          <div class="skeleton-avatar"></div>
          <div class="skeleton-avatar"></div>
          <div class="skeleton-avatar"></div>
          <div class="skeleton-avatar"></div>
        </div>
      </div>
    </section>

    <!-- Feed posts placeholder -->
    <main class="feed">
      <div class="feed-post">
        <div class="post-header">
          <div class="post-avatar" style="background: linear-gradient(135deg,#f5a623,#e040fb)"></div>
          <div class="post-meta">
            <div class="post-username">cosmic.wander</div>
            <div class="post-location">Patagonia, Chile</div>
          </div>
          <svg class="post-more" width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </div>
        <div class="post-image" style="background:linear-gradient(160deg,#0d1b2a 0%,#1b4332 100%);height:300px;border-radius:16px;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:48px">🏔️</span>
        </div>
        <div class="post-actions">
          <div class="action-group">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </div>
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="post-likes">2,847 likes</div>
        <div class="post-caption"><span class="caption-username">cosmic.wander</span> When the mountains call, you answer. No filter needed. 🌌</div>
      </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22" fill="none" stroke="white" stroke-width="1.8"/></svg>
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <div class="add-btn">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <div class="nav-avatar" style="background:linear-gradient(135deg,#f5a623,#e040fb)"></div>
    </nav>
  </div>

  <!-- ========== STORY VIEWER ========== -->
  <div class="story-viewer" id="storyViewer" aria-hidden="true">

    <!-- Progress bars -->
    <div class="progress-bars" id="progressBars"></div>

    <!-- Top bar -->
    <div class="viewer-topbar">
      <div class="viewer-user">
        <div class="viewer-avatar-wrap">
          <img class="viewer-avatar" id="viewerAvatar" src="" alt="" />
        </div>
        <div class="viewer-info">
          <div class="viewer-username" id="viewerUsername"></div>
          <div class="viewer-time" id="viewerTime"></div>
        </div>
      </div>
      <div class="viewer-controls">
        <button class="ctrl-btn" id="pauseBtn" aria-label="Pause">
          <svg id="pauseIcon" width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          <svg id="playIcon" width="18" height="18" fill="currentColor" viewBox="0 0 24 24" style="display:none"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
        <button class="ctrl-btn" id="closeBtn" aria-label="Close">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- Story image -->
    <div class="story-image-wrap" id="storyImageWrap">
      <img class="story-image" id="storyImage" src="" alt="" />
      <div class="story-loading" id="storyLoading">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- Tap zones -->
    <div class="tap-zone tap-left"  id="tapLeft"></div>
    <div class="tap-zone tap-right" id="tapRight"></div>

    <!-- Bottom reply bar -->
    <div class="viewer-bottom">
      <div class="reply-bar">
        <input class="reply-input" type="text" placeholder="Reply to story…" readonly />
        <button class="reply-send">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
